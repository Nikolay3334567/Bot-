<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — {name}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%237c5cff%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2714%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27 font-weight=%27700%27%3EYA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="site.css">
<script src="config.js"></script><script src="auth.js"></script>
</head><body>
<div data-nav></div>
<main><div class="authbox card">
  <h1>Вход</h1><p class="lead" style="margin-bottom:6px">Войдите, чтобы управлять подпиской и синхронизацией.</p>
  <button class="btn gbtn" id="google"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Войти через Google</button>
  <div id="gmount" style="display:none;margin-top:10px"></div>
  <div class="sep">или</div>
  <form id="form" autocomplete="off">
    <label class="f">Логин<input class="in" id="user" autocomplete="username"></label>
    <label class="f">Пароль<input class="in" id="pass" type="password" autocomplete="current-password"></label>
    <div class="err" id="err"></div>
    <button class="btn" style="width:100%">Войти</button>
  </form>
  <p class="note" id="devnote" style="margin-top:18px;display:none">🧪 Тестовый вход: логин <b>admin</b>, пароль <b>admin</b>.</p>
</div></main>
<div data-footer></div>
<script src="common.js"></script>
<script>
  const S = SITE;
  if (S.devLogin.enabled) document.getElementById('devnote').style.display = 'block';
  if (Auth.session()) location.href = 'account.html';
  const done = () => { location.href = 'account.html'; };
  document.getElementById('form').onsubmit = (e) => {
    e.preventDefault();
    try { Auth.loginLocal(document.getElementById('user').value.trim(), document.getElementById('pass').value); done(); }
    catch (x) { document.getElementById('err').textContent = x.message; }
  };
  document.getElementById('google').onclick = () => {
    if (!S.googleClientId) {
      document.getElementById('err').innerHTML = 'Вход через Google ещё не настроен: впишите <code>googleClientId</code> в <code>site/config.js</code> (инструкция — docs/BUSINESS.md, раздел «Google-вход»). Открывайте сайт по адресу http://localhost:8766/site/.';
      return;
    }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = () => {
      google.accounts.id.initialize({ client_id: S.googleClientId, callback: (r) => { try { Auth.loginGoogle(r.credential); done(); } catch (x) { document.getElementById('err').textContent = x.message; } } });
      const m = document.getElementById('gmount'); m.style.display = 'block';
      google.accounts.id.renderButton(m, { theme: 'filled_blue', size: 'large', width: 340, text: 'continue_with' });
      google.accounts.id.prompt();
    };
    s.onerror = () => { document.getElementById('err').textContent = 'Не удалось загрузить Google (нужен интернет).'; };
    document.head.append(s);
  };
</script>
</body></html>
