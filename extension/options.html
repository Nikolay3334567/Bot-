<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT → Anki Miner — настройки</title>
  <link rel="stylesheet" href="settings-form.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <h1>YT → Anki Miner</h1>
  <p class="hint">Те же настройки открываются прямо в плеере YouTube: кнопка <b>YA ON ⚙</b> внизу видео.</p>
  <section>
    <div class="row"><button id="test" class="sec">Проверить связь с Anki</button><span id="status"></span></div>
    <datalist id="decks"></datalist>
  </section>
  <section class="dark"><div id="settings"></div></section>

  <section>
    <h2>Мой словарь</h2>
    <p id="counts" class="hint"></p>
    <div class="row">
      <input type="search" id="filter" placeholder="Поиск слова…">
      <select id="show"><option value="1">Изучаю</option><option value="2">Знаю</option><option value="3">Не учить</option><option value="all">Все</option></select>
    </div>
    <div id="list"></div>
    <h3>Импорт</h3>
    <p class="hint">Вставьте слова — по одному в строке (или CSV, берётся первая колонка) — либо выберите файл .txt/.csv.</p>
    <textarea id="importText" rows="5" placeholder="apple&#10;to get along&#10;…"></textarea>
    <div class="row">
      <input type="file" id="importFile" accept=".txt,.csv,.tsv">
      <select id="importStatus"><option value="2">как «Знаю»</option><option value="1">как «Изучаю»</option></select>
      <button id="importBtn">Импортировать</button>
    </div>
    <div class="row"><button id="exportBtn" class="sec">Экспорт в CSV</button><button id="clearBtn" class="danger">Очистить словарь</button></div>
  </section>
</main>
<script src="defaults.js"></script>
<script src="settings-ui.js"></script>
<script src="settings-form.js"></script>
<script src="options.js"></script>
</body>
</html>
