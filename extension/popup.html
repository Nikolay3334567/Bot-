<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>YT → Anki Miner</title>
  <style>
    body { width: 290px; margin: 0; padding: 14px 16px; background: #fff; color: #1d1d1f; font: 13px/1.4 system-ui, Roboto, Arial, sans-serif; }
    h1 { margin: 0 0 10px; font-size: 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
    input[type=text] { box-sizing: border-box; width: 100%; padding: 5px 7px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    button { padding: 7px 12px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font: inherit; cursor: pointer; width: 100%; }
    #status { font-size: 12px; }
    .ok { color: #1e7e34; } .err { color: #b3261e; }
  </style>
</head>
<body>
  <h1>YT → Anki Miner</h1>
  <label class="row"><span>Включено на YouTube</span><input type="checkbox" data-k="enabled"></label>
  <div>Колода Anki</div>
  <input type="text" data-k="deck" list="decks"><datalist id="decks"></datalist>
  <div class="row"><span id="status"></span></div>
  <div class="row"><span id="queue"></span><button id="sync" style="width:auto;padding:5px 10px">⟳ Синхронизировать</button></div>
  <label class="row"><span>Автопауза после фразы</span><input type="checkbox" data-k="autoPause"></label>
  <label class="row"><span>Показывать перевод</span><input type="checkbox" data-k="showTranslation"></label>
  <label class="row"><span>✨ ИИ</span><select data-k="aiMode" style="width:170px"><option value="off">Выключен</option><option value="text">Текст</option><option value="audio">🎧 Слушает видео</option></select></label>
  <button id="options">Все настройки и словарь</button>
  <script src="defaults.js"></script>
  <script src="settings-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
