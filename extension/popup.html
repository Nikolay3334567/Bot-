<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>YT → Anki Miner</title>
  <style>
    body { width: 320px; margin: 0; padding: 14px 16px; background: #fff; color: #1d1d1f; font: 13px/1.4 system-ui, Roboto, Arial, sans-serif; }
    h1 { margin: 0 0 10px; font-size: 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
    .row.col { flex-direction: column; align-items: stretch; gap: 4px; }
    input[type=text], input[type=number], select { box-sizing: border-box; width: 100%; padding: 5px 7px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    input[type=number] { width: 80px; }
    fieldset { margin: 10px 0; padding: 4px 10px; border: 1px solid #e3e3e3; border-radius: 8px; }
    legend { padding: 0 4px; color: #666; font-size: 12px; }
    button { padding: 6px 12px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font: inherit; cursor: pointer; }
    #status { margin-left: 8px; font-size: 12px; }
    .ok { color: #1e7e34; } .err { color: #b3261e; }
    .hint { color: #777; font-size: 11px; }
  </style>
</head>
<body>
  <h1>YT → Anki Miner</h1>

  <label class="row"><span>Включено на YouTube</span><input type="checkbox" data-k="enabled"></label>

  <fieldset>
    <legend>Anki</legend>
    <div class="row col">
      <span>Колода</span>
      <input type="text" data-k="deck" list="decks">
      <datalist id="decks"></datalist>
    </div>
    <div class="row"><span><button id="test">Проверить связь</button><span id="status"></span></span></div>
    <label class="row"><span>Сохранять аудио фрагмента</span><input type="checkbox" data-k="includeAudio"></label>
    <label class="row"><span>Сохранять кадр из видео</span><input type="checkbox" data-k="includeImage"></label>
    <label class="row"><span>Запас до фразы, сек</span><input type="number" step="0.05" min="0" max="3" data-k="padStart"></label>
    <label class="row"><span>Запас после фразы, сек</span><input type="number" step="0.05" min="0" max="3" data-k="padEnd"></label>
  </fieldset>

  <fieldset>
    <legend>Субтитры</legend>
    <label class="row"><span>Язык перевода</span>
      <select data-k="targetLang" style="width:140px">
        <option value="ru">Русский</option>
        <option value="uk">Українська</option>
        <option value="be">Беларуская</option>
        <option value="kk">Қазақша</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
        <option value="pl">Polski</option>
        <option value="tr">Türkçe</option>
        <option value="zh-CN">中文</option>
        <option value="ja">日本語</option>
      </select>
    </label>
    <label class="row"><span>Показывать перевод</span><input type="checkbox" data-k="showTranslation"></label>
    <label class="row"><span>Размывать перевод (видно при наведении)</span><input type="checkbox" data-k="blurTranslation"></label>
    <label class="row"><span>Пауза при наведении на субтитры</span><input type="checkbox" data-k="pauseOnHover"></label>
    <label class="row"><span>Автопауза после каждой фразы</span><input type="checkbox" data-k="autoPause"></label>
    <label class="row"><span>Размер шрифта, px</span><input type="number" min="12" max="60" data-k="fontSize"></label>
  </fieldset>

  <p class="hint">Нужен запущенный Anki с дополнением AnkiConnect (код 2055492159).</p>
  <script src="popup.js"></script>
</body>
</html>
