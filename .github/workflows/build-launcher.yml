name: Build launcher

on:
  push:
    tags: ['v*']
    paths: ['launcher/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build (Windows ARM64 / x64, macOS, Linux)
        working-directory: launcher
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ytam-launcher
          path: launcher/dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: launcher/dist/*
